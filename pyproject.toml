[project]
name = "opensupport"
version = "0.1.0"
description = "Board de tickets agent-native: los agentes de código postean tickets validados vía MCP"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]>=0.141",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "fastmcp>=3.2,<4.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
]

[project.scripts]
opensupport = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.13",
    "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
# Una CLI existe para imprimir. T201 no aplica ahí.
"app/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: tests de carga, tardan más que el resto"]