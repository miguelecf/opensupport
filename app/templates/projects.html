{% extends "base.html" %}
{% block content %}
<h1>Proyectos</h1>
<div class="table-wrap"><table class="admin">
  <thead><tr><th>Slug</th><th>Nombre</th><th>Sesiones abiertas</th></tr></thead>
  <tbody>
  {% for p in projects %}
    <tr><td><code>{{ p.slug }}</code></td><td>{{ p.name }}</td><td>{{ p.next_session_seq - 1 }}</td></tr>
  {% endfor %}
  </tbody>
</table></div>
<h2>Crear proyecto</h2>
<form method="post" action="/settings/projects" class="inline">
  {{ csrf_field(csrf_token) }}
  <input type="text" name="slug" placeholder="mi-tesis" required>
  <input type="text" name="name" placeholder="Mi tesis" required>
  <button>Crear</button>
</form>
{% endblock %}
