{% extends "base.html" %}
{% block title %}Entrar — OpenSupport{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Entrar</h1>
  <p class="muted">Pegá uno de tus tokens de OpenSupport. Es lo mismo que usan los agentes.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="token" placeholder="os_..." required autofocus>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
